<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Визуализатор бит БЭСМ-6 и IEEE-754</title>
<style>
:root {
  color-scheme: light;
  --bg:#eef1f6; --panel:#fff; --panel-2:#f7f9fc; --text:#1b2330;
  --muted:#5f6b7c; --border:#d4dbe5; --accent:#2f6fed; --accent-fg:#fff;
  --danger:#c0392b; --shadow:0 1px 3px rgba(20,30,50,.13);
  --k-sign-bg:#ffd8d8;--k-sign-fg:#8b1a1a;
  --k-exponent-bg:#ffe6ad;--k-exponent-fg:#6d4a00;
  --k-fraction-bg:#cfe6ff;--k-fraction-fg:#0f4571;
  --k-register-bg:#d0f0d4;--k-register-fg:#155c22;
  --k-format-bg:#e3d7ff;--k-format-fg:#432a7a;
  --k-opcode-bg:#f2d3ff;--k-opcode-fg:#5c1a7a;
  --k-address-bg:#dee4ec;--k-address-fg:#2f3947;
  --k-value-bg:#e4e9f0;--k-value-fg:#2f3947;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:#0e1219;--panel:#161d27;--panel-2:#1c2531;--text:#e6ecf5;
  --muted:#93a1b5;--border:#2a3546;--accent:#4f8cff;--accent-fg:#0b1119;
  --danger:#ff6b6b;--shadow:0 1px 3px rgba(0,0,0,.5);
  --k-sign-bg:#4a1f24;--k-sign-fg:#ffb3b8;
  --k-exponent-bg:#4a3a12;--k-exponent-fg:#ffd77a;
  --k-fraction-bg:#16334f;--k-fraction-fg:#8ecbff;
  --k-register-bg:#143a1e;--k-register-fg:#8fe6a4;
  --k-format-bg:#2d2350;--k-format-fg:#c6b0ff;
  --k-opcode-bg:#3d1d4d;--k-opcode-fg:#e5a9ff;
  --k-address-bg:#232c3a;--k-address-fg:#b6c3d6;
  --k-value-bg:#222b39;--k-value-fg:#b6c3d6;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:0 0 2rem;background:var(--bg);color:var(--text);
  font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;
  transition:background .18s,color .18s}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.7rem 1.1rem;background:var(--panel);border-bottom:1px solid var(--border);
  box-shadow:var(--shadow);position:sticky;top:0;z-index:10;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:.7rem}
.logo{font-weight:800;letter-spacing:.04em;font-size:1.05rem;color:var(--accent);
  border:2px solid var(--accent);border-radius:7px;padding:.1rem .5rem}
.brand h1{font-size:1.05rem;margin:0;font-weight:600}
.theme-btn{font:inherit;padding:.4rem .8rem;border-radius:8px;
  border:1px solid var(--border);background:var(--panel-2);color:var(--text);cursor:pointer}
.theme-btn:hover{border-color:var(--accent)}
.tabs{display:flex;flex-wrap:wrap;gap:.35rem;padding:.65rem 1.1rem 0}
.tab{font:inherit;padding:.42rem .9rem;border:1px solid var(--border);border-bottom:none;
  border-radius:9px 9px 0 0;background:var(--panel-2);color:var(--muted);cursor:pointer}
.tab:hover{color:var(--text)}
.tab.active{background:var(--panel);color:var(--text);font-weight:600;
  box-shadow:inset 0 3px 0 0 var(--accent)}
.content{display:flex;flex-direction:column;gap:1rem;padding:1rem 1.1rem 0}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--shadow);padding:.85rem .95rem 1rem}
.panel.hidden{display:none}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  margin-bottom:.7rem;flex-wrap:wrap}
.panel-head h2{font-size:.95rem;margin:0;text-transform:uppercase;
  letter-spacing:.05em;color:var(--muted)}
.hint{text-transform:none;letter-spacing:0;font-weight:400;font-size:.82rem;color:var(--muted)}

.bit-scroll{overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.bit-scroll::-webkit-scrollbar{height:9px}
.bit-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
.bit-grid{display:inline-grid;gap:3px;align-items:stretch}

.field-label{font-size:.68rem;font-weight:700;text-align:center;padding:3px 3px;
  border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:0;cursor:default;transition:filter .1s}
.field-label.hl{filter:brightness(1.2);box-shadow:0 0 0 2px currentColor}

.bit-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2px 0 2px;border-radius:5px;border:1px solid transparent;font:inherit;
  cursor:pointer;transition:filter .1s,box-shadow .1s,transform .05s;
  --bc:var(--k-value-fg);--bb:var(--k-value-bg);background:var(--bb);color:var(--bc);
  border-color:color-mix(in srgb,var(--bc) 35%,transparent);
  min-width:0;overflow:hidden}
.bit-cell:hover{filter:brightness(1.12)}
.bit-cell:active{transform:translateY(1px)}
.bit-cell.hl{box-shadow:0 0 0 2px var(--bc)}
.bit-cell .v{font-size:.85rem;font-weight:500;line-height:1;opacity:.45;
  font-variant-numeric:tabular-nums;pointer-events:none}
.bit-cell .i{font-size:.56rem;line-height:1;opacity:.65;margin-top:2px;
  font-variant-numeric:tabular-nums;pointer-events:none;
  max-width:100%;overflow:hidden;white-space:nowrap}
.bit-cell.on{border-color:var(--bc);box-shadow:inset 0 -3px 0 0 var(--bc)}
.bit-cell.on.hl{box-shadow:inset 0 -3px 0 0 var(--bc),0 0 0 2px var(--bc)}
.bit-cell.on .v{font-weight:900;opacity:1}
.bit-cell.on .i{opacity:.9}

.k-sign{--bc:var(--k-sign-fg);--bb:var(--k-sign-bg)}
.k-exponent{--bc:var(--k-exponent-fg);--bb:var(--k-exponent-bg)}
.k-fraction{--bc:var(--k-fraction-fg);--bb:var(--k-fraction-bg)}
.k-register{--bc:var(--k-register-fg);--bb:var(--k-register-bg)}
.k-format{--bc:var(--k-format-fg);--bb:var(--k-format-bg)}
.k-opcode{--bc:var(--k-opcode-fg);--bb:var(--k-opcode-bg)}
.k-address{--bc:var(--k-address-fg);--bb:var(--k-address-bg)}
.k-value{--bc:var(--k-value-fg);--bb:var(--k-value-bg)}

.legend{display:flex;flex-wrap:wrap;gap:.3rem .8rem;margin-top:.7rem;
  padding-top:.5rem;border-top:1px dashed var(--border);font-size:.72rem}
.legend-item{display:inline-flex;align-items:center;gap:.32rem;color:var(--muted)}
.legend-swatch{width:.8rem;height:.8rem;border-radius:3px;
  border:1px solid rgba(128,128,128,.35)}
.bits-note{font-size:.72rem;color:var(--muted);margin-top:.4rem;font-style:italic}

.controls{display:flex;flex-wrap:wrap;gap:.7rem 1.1rem;align-items:flex-end;
  padding-bottom:.8rem;border-bottom:1px dashed var(--border);margin-bottom:.8rem}
.control-group{display:flex;flex-direction:column;gap:.25rem}
.control-group.hidden{display:none}
.control-group>label{font-size:.74rem;text-transform:uppercase;
  letter-spacing:.05em;color:var(--muted)}
select,input[type="text"]{font:inherit;padding:.34rem .5rem;border-radius:7px;
  border:1px solid var(--border);background:var(--panel-2);color:var(--text);min-width:10rem}
select:focus,input[type="text"]:focus,button:focus-visible{
  outline:2px solid var(--accent);outline-offset:1px}
.radio-row{display:flex;gap:.9rem;align-items:center;flex-wrap:wrap}
.radio-row label{display:inline-flex;align-items:center;gap:.3rem;font-size:.86rem;
  cursor:pointer;text-transform:none;letter-spacing:0;color:var(--text)}
button{font:inherit;padding:.38rem .8rem;border-radius:8px;border:1px solid var(--border);
  background:var(--panel-2);color:var(--text);cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);
  font-weight:600;padding:.5rem 1.2rem}
button.primary:hover{filter:brightness(1.08)}
.bit-actions{display:flex;gap:.4rem}
.bit-actions button{padding:.25rem .6rem;font-size:.8rem}
.actions{margin-top:.9rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.result-card{display:grid;gap:.45rem}
.result-line{display:grid;grid-template-columns:minmax(9rem,auto) 1fr;gap:.6rem;
  padding:.4rem .6rem;border-radius:8px;background:var(--panel-2);
  border:1px solid var(--border);align-items:baseline}
.result-line .k{font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;
  color:var(--muted)}
.result-line .v{font-family:"Cascadia Mono",Consolas,monospace;font-size:.9rem;
  word-break:break-all}
.result-line.big .v{font-size:1.15rem;font-weight:700;color:var(--accent)}
.result-empty{color:var(--muted);font-style:italic;padding:.5rem 0}
.result-error{color:var(--danger);font-weight:600;padding:.55rem .7rem;
  border:1px solid var(--danger);border-radius:8px;
  background:color-mix(in srgb,var(--danger) 10%,transparent)}
.formula-block{margin-top:.3rem;border:1px solid var(--border);
  border-left:4px solid var(--accent);border-radius:9px;background:var(--panel-2);
  padding:.55rem .8rem .65rem}
.formula-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);margin-bottom:.35rem;font-weight:700}
.formula{font-family:"Cascadia Mono",Consolas,monospace;font-size:.9rem;
  line-height:1.6;color:var(--text);word-break:break-word}
.formula .sub{font-size:.7em;vertical-align:sub}
.formula .sup{font-size:.7em;vertical-align:super}
.formula .op{color:var(--accent);font-weight:700}
.formula .num{display:inline-block;padding:0 .3rem;border-radius:4px;
  background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.journal{display:flex;flex-direction:column;gap:.7rem;max-height:42vh;
  overflow-y:auto;padding-right:.3rem}
.journal:empty::after{content:"Журнал пуст. Нажмите «Декодировать», чтобы добавить отчёт.";
  color:var(--muted);font-style:italic;font-size:.88rem}
.journal-entry{border:1px solid var(--border);border-left:4px solid var(--accent);
  border-radius:9px;background:var(--panel-2);padding:.55rem .75rem;font-size:.86rem}
.journal-entry.error{border-left-color:var(--danger)}
.journal-entry header{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap;
  margin-bottom:.35rem}
.j-time{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.j-op{font-weight:700}
.j-input{color:var(--muted);font-size:.82rem;margin-bottom:.3rem}
.j-input code{font-family:"Cascadia Mono",Consolas,monospace;color:var(--text);
  word-break:break-all}
.j-steps{margin:.3rem 0 .35rem 1.2rem;padding:0;display:grid;gap:.18rem;
  color:var(--muted)}
.j-steps li::marker{color:var(--accent);font-weight:700}
.j-result{border-top:1px dashed var(--border);padding-top:.3rem;margin-top:.3rem}
.j-result strong{font-family:"Cascadia Mono",Consolas,monospace;color:var(--accent);
  word-break:break-all}

/* ============================ Регистры ============================ */
.registers-view{display:flex;flex-direction:column;gap:1rem}
.reg-section{padding-bottom:.85rem;border-bottom:1px dashed var(--border)}
.reg-section:last-child{border-bottom:none;padding-bottom:0}
.reg-section h3{margin:0 0 .5rem;font-size:.78rem;text-transform:uppercase;
  letter-spacing:.05em;color:var(--muted);font-weight:700}
.reg-section h3 .hint{font-size:.7rem;text-transform:none;letter-spacing:0;font-weight:400}
.reg-line{display:flex;align-items:center;gap:.6rem;padding:.28rem 0;
  overflow-x:auto;scrollbar-width:thin}
.reg-line::-webkit-scrollbar{height:7px}
.reg-line::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.reg-label{min-width:2.6rem;font-family:"Cascadia Mono",Consolas,monospace;
  font-weight:700;color:var(--accent);font-size:.95rem;text-align:right;
  line-height:1.1;flex-shrink:0}
.reg-label small{color:var(--muted);font-size:.65rem;font-weight:500;
  font-family:inherit;display:block;line-height:1}
.reg-bits{display:flex;gap:1px;flex-wrap:nowrap;flex-shrink:0;--rbs:16px}
.reg-bits.sz-48{--rbs:14px}
.reg-bits.sz-15{--rbs:22px}
.reg-bits.sz-6 {--rbs:32px}
.reg-bit{width:var(--rbs);height:calc(var(--rbs) + 4px);
  border:1px solid color-mix(in srgb,var(--bc) 38%,transparent);
  background:var(--bb);color:var(--bc);
  font:inherit;font-size:.72rem;font-weight:500;
  border-radius:3px;cursor:pointer;
  display:grid;place-items:center;padding:0;
  --bc:var(--k-value-fg);--bb:var(--k-value-bg);
  opacity:.55;transition:filter .1s,box-shadow .1s,opacity .1s;
  font-variant-numeric:tabular-nums;flex-shrink:0}
.reg-bit.sz-48-font{font-size:.62rem}
.reg-bit:hover{filter:brightness(1.15)}
.reg-bit:active{transform:translateY(1px)}
.reg-bit.on{opacity:1;font-weight:900;box-shadow:inset 0 -2px 0 0 var(--bc)}
.reg-bit:disabled{cursor:not-allowed;opacity:.35}
.reg-bit.group-sep{margin-left:4px}
.reg-value{font-family:"Cascadia Mono",Consolas,monospace;font-size:.82rem;
  color:var(--muted);white-space:nowrap;flex-shrink:0;min-width:14rem}
.reg-value strong{color:var(--accent);font-weight:700}
.reg-mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));
  gap:.15rem .9rem}
.reg-mgrid .reg-line{padding:.15rem 0;border:none}
.reg-mgrid .reg-label{min-width:2.2rem;font-size:.82rem}
.r-decode{margin-top:.55rem;display:grid;gap:.2rem;padding:.55rem .8rem;
  border-radius:8px;background:var(--panel-2);border:1px solid var(--border);
  font-family:"Cascadia Mono",Consolas,monospace;font-size:.82rem}
.r-bit{display:grid;grid-template-columns:5.5rem 1fr auto;gap:.7rem;
  align-items:baseline;padding:.12rem 0}
.r-bit .r-pos{color:var(--muted);font-weight:600;font-size:.78rem}
.r-bit .r-label{color:var(--text)}
.r-bit .r-value{color:var(--muted);font-weight:600;white-space:nowrap}
.r-bit.set .r-value{color:var(--accent);font-weight:700}
.r-bit.set .r-pos{color:var(--accent)}

/* ============================ Перфокарта ============================ */
#punchcard-view{display:flex;flex-direction:column;gap:.7rem}
#punchcard-view .pc-presets{display:flex;gap:.35rem;flex-wrap:wrap;
  justify-content:center;padding:.5rem;background:var(--panel-2);
  border:1px solid var(--border);border-radius:8px}
#punchcard-view .pc-preset-btn{background:var(--panel);color:var(--text);
  border:1px solid var(--border);width:38px;height:38px;border-radius:5px;
  font-size:17px;cursor:pointer;font-family:'Courier New',monospace;
  transition:.15s;display:flex;justify-content:center;align-items:center;padding:0}
#punchcard-view .pc-preset-btn:hover{background:var(--accent);
  color:var(--accent-fg);border-color:var(--accent)}
#punchcard-view .pc-scroll{overflow:auto;padding:.5rem;background:var(--bg);
  border:1px solid var(--border);border-radius:8px;display:flex;
  justify-content:center;align-items:flex-start;min-height:200px}

/* Фикс бага фона: жесткие размеры для оберток */
#punchcard-view .pc-outer{flex-shrink:0;position:relative}
#punchcard-view .pc-inner{
  width:188.325mm;
  height:83.55mm;
  transform-origin:top left
}
#punchcard-view .card-wrapper{
  width:188.325mm;
  height:83.55mm;
  box-sizing:border-box;
  background:#9D7E61;
  padding:0.5mm;
  clip-path:polygon(6.35mm 0, 100% 0, 100% 100%, 0 100%, 0 6.35mm);
  box-shadow:0 8px 24px rgba(0,0,0,0.45)
}
#punchcard-view .card{
  position:relative;
  width:187.325mm;
  height:82.55mm;
  background-color:#FAD7B9;
  color:#9D7E61;
  font-family:'Courier New', Courier, monospace;
  clip-path:polygon(5.85mm 0, 100% 0, 100% 100%, 0 100%, 0 5.85mm);
  box-sizing:border-box;
  user-select:none;
  overflow:hidden /* Фикс переполнения */
}
#punchcard-view .top-text{
  position:absolute;top:1.2mm;left:7mm;
  font-size:2.1mm;font-weight:bold;letter-spacing:0.1mm;white-space:nowrap;
  font-family:'Courier New', Courier, monospace
}
#punchcard-view .grid-area{
  position:absolute;top:3.175mm;left:4.1402mm;
  display:grid;
  grid-template-columns:repeat(80, 2.2098mm);
  grid-template-rows:repeat(12, 6.35mm)
}
#punchcard-view .cell{
  width:2.2098mm;height:6.35mm;position:relative;cursor:crosshair
}
#punchcard-view .cell span{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%, -50%);
  font-size:1.6mm;font-weight:bold;opacity:0.6;line-height:1;pointer-events:none;
  font-family:'Courier New', Courier, monospace
}
#punchcard-view .cell:hover{background-color:rgba(157, 126, 97, 0.15)}
#punchcard-view .cell.hole span{opacity:0}
#punchcard-view .cell.hole::after{
  content:'';position:absolute;
  width:1.397mm;height:3.175mm;background-color:#2b1d14;border-radius:0;
  box-shadow:inset 0.1mm 0.1mm 0.2mm rgba(0,0,0,0.8);
  top:50%;left:50%;transform:translate(-50%, -50%)
}
#punchcard-view .col-nums{
  position:absolute;left:4.1402mm;width:176.784mm;
  display:grid;grid-template-columns:repeat(80, 2.2098mm);
  height:2mm;z-index:10;pointer-events:none;background-color:#FAD7B9
}
#punchcard-view .col-nums.top{top:15.875mm;transform:translateY(-50%)}
#punchcard-view .col-nums.bottom{top:79.375mm;transform:translateY(-50%)}
#punchcard-view .num-cell{
  text-align:center;font-size:1.2mm;font-weight:bold;
  display:flex;justify-content:center;align-items:center;
  font-family:'Courier New', Courier, monospace
}

@media (max-width:900px){
  .result-line{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">БЭСМ-6</span>
    <h1>Визуализатор битовых форматов</h1>
  </div>
  <button id="themeToggle" class="theme-btn" type="button">🌙 Тёмная</button>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="besm6"     type="button">Число БЭСМ-6</button>
  <button class="tab"        data-tab="command"   type="button">Команда БЭСМ-6</button>
  <button class="tab"        data-tab="registers" type="button">Регистры БЭСМ-6</button>
  <button class="tab"        data-tab="ieee"      type="button">IEEE-754</button>
  <button class="tab"        data-tab="integer"   type="button">Целые числа</button>
  <button class="tab"        data-tab="radix"     type="button">Системы счисления</button>
  <button class="tab"        data-tab="punchcard" type="button">Перфокарта</button>
</nav>

<div class="content">

  <section class="panel" id="bitsPanel">
    <div class="panel-head">
      <h2>Биты <span class="hint" id="bitsInfo">старший → младший</span></h2>
      <div class="bit-actions">
        <button type="button" id="clearBits">Сброс</button>
        <button type="button" id="invertBits">Инверсия</button>
      </div>
    </div>
    <div class="bit-scroll"><div class="bit-grid" id="bitGrid"></div></div>
    <div class="legend" id="legend"></div>
    <div class="bits-note" id="bitsNote"></div>
  </section>

  <section class="panel">
    <div class="controls" id="controls">

      <div class="control-group" data-tab="ieee">
        <label for="ieeeFormat">Формат</label>
        <select id="ieeeFormat">
          <option value="16">binary16 (Half)</option>
          <option value="32" selected>binary32 (float)</option>
          <option value="64">binary64 (double)</option>
        </select>
      </div>

      <div class="control-group" data-tab="integer">
        <label for="intWidth">Разрядность</label>
        <select id="intWidth">
          <option value="8">8 бит</option>
          <option value="16" selected>16 бит</option>
          <option value="32">32 бита</option>
          <option value="64">64 бита</option>
        </select>
      </div>

      <div class="control-group" data-tab="integer">
        <label>Интерпретация</label>
        <div class="radio-row">
          <label><input type="radio" name="intSign" value="signed" checked> Знаковое</label>
          <label><input type="radio" name="intSign" value="unsigned"> Беззнаковое</label>
        </div>
      </div>

      <div class="control-group" data-tab="command">
        <label for="cmdSyntax">Синтаксис ассемблера</label>
        <select id="cmdSyntax">
          <option value="autocode" selected>Автокод (кириллица, верхний регистр)</option>
          <option value="bemsh">БЭМШ (кириллица, нижний регистр)</option>
          <option value="madlen">Мадлен (,OP,M ADDR,)</option>
          <option value="b6as">b6as (латиница)</option>
        </select>
      </div>

      <div class="control-group" data-tab="registers">
        <label>Формат вывода</label>
        <div class="radio-row">

  function generatePunchFromText() {

    for (var i = 0; i < PC_ROWS; i++) punchHoles.push(new Array(PC_COLS).fill(false));
    if (format === 'row') {
      var startRow = 2, charsPerRow = 10, charIndex = 0;
      for (var r = startRow; r < PC_ROWS; r++) {

          var code8 = pcAddOddParity(code7);

          for (var b = 0; b < 8; b++) {
            if ((code8 >> (7 - b)) & 1) punchHoles[r][baseCol + b] = true;

      var upperText = text.toUpperCase();
      var len = Math.min(upperText.length, PC_COLS);
      for (var c = 0; c < len; c++) {
        var punches = COLUMN_MAP[upperText[c]];
        if (punches) {

        for (var cp = 0; cp < 10; cp++) {

          for (var b = 0; b < 8; b++) {

          result += hasPunch ? (UPP_CODES_REV[code8 & 0x7F] || ' ') : ' ';

    for (var i = 0; i < PC_COLS; i++) {

  /* --- Загрузка html2canvas ленивая --- */
  function loadHtml2Canvas() {
    return new Promise(function(resolve, reject) {
      if (window.html2canvas) { resolve(window.html2canvas); return; }
      var script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
      script.onload = function() { resolve(window.html2canvas); };
      script.onerror = function() { reject(new Error('Не удалось загрузить html2canvas')); };
      document.head.appendChild(script);
    });
  }
  function exportPunchPNG() {
    var target = document.getElementById('pcCardExport');

    var inner = document.querySelector('#punchcard-view .pc-inner');
    var outer = document.querySelector('#punchcard-view .pc-outer');
    if (!inner || !outer) return;
    var savedTransform = inner.style.transform;
    var savedWidth = outer.style.width;
    var savedHeight = outer.style.height;
    inner.style.transform = 'none';
    outer.style.width = 'auto';
    outer.style.height = 'auto';
    function restore() {
      inner.style.transform = savedTransform;
      outer.style.width = savedWidth;
      outer.style.height = savedHeight;
    }
    loadHtml2Canvas().then(function() {
      return html2canvas(target, {
        scale: 4, backgroundColor: null, useCORS: true, logging: false
      });
    }).then(function(canvas) {
      restore();
      var link = document.createElement('a');
      link.download = 'besm6_punchcard.png';
      link.href = canvas.toDataURL('image/png');
      link.click();

      logError('PNG export', err);

  /* =====================================================================
   *  Радикс
   * ===================================================================== */
  var RADIX_ALPHABET = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  function digitValue(ch) {
    if (ch >= '0' && ch <= '9') return ch.charCodeAt(0) - 48;
    if (ch >= 'a' && ch <= 'z') return ch.charCodeAt(0) - 97 + 10;
    if (ch >= 'A' && ch <= 'Z') return ch.charCodeAt(0) - 65 + 10;
    throw new Error('Символ «' + ch + '» не является цифрой числа.');
  }
  function convertRadix(input, src, dst) {
    if (typeof input !== 'string' || input.trim() === '')
      throw new Error('Введите число: строка не может быть пустой.');
    if (!(src >= 2 && src <= 36)) throw new Error('Основание-источник должно быть от 2 до 36.');
    if (!(dst >= 2 && dst <= 36)) throw new Error('Целевое основание должно быть от 2 до 36.');
    var trimmed = input.trim(), steps = [];
    var neg = trimmed.charAt(0) === '-', mag = neg ? trimmed.slice(1) : trimmed;
    if (mag.length === 0) throw new Error('После знака «−» должна идти хотя бы одна цифра.');
    if (neg) steps.push('Знак «−» запоминается отдельно.');
    if (mag === '0') {
      return { kind:'radix', steps:['Число равно 0.','Ноль одинаков в любой системе.'],
        formula:'<b>0</b> <span class="op">→</span> 0',
        resultText:'0', inputText:'«' + trimmed + '» (осн. ' + src + ')',
        operation:'Системы счисления — ' + src + ' → ' + dst };
    }
    var v = 0n;
    for (var i = 0; i < mag.length; i++) {
      var s = mag.charAt(i), d = digitValue(s);
      if (d >= src) throw new Error('Цифра «' + s + '» не существует в системе с основанием ' + src + '.');
      var nx = v * BigInt(src) + BigInt(d);
      steps.push('Разряд ' + i + ': ' + v + ' × ' + src + ' + ' + d + ' = ' + nx + '.');
      v = nx;
    }
    var rem = v, digs = [];
    while (rem > 0n) {
      var q = rem / BigInt(dst), r = rem % BigInt(dst);
      rem = q;
      var od = RADIX_ALPHABET.charAt(Number(r));
      digs.push(od);
      steps.push('Деление на ' + dst + ': остаток ' + r + ' → «' + od + '».');
    }
    digs.reverse();
    var out = (neg ? '−' : '') + digs.join('');
    steps.push('Чтение остатков снизу вверх: ' + out + '.');
    var formula =
      'вход: <b>V</b> <span class="op">=</span> Σ d<span class="sub">i</span> · ' +
      src + '<span class="sup">(n−1−i)</span><br>' +
      'выход: повторное деление на ' + dst + '<br>' +
      '<span class="op">→</span> <span class="num">' + out + '</span>';
    return { kind:'radix', steps:steps, formula:formula,
      resultText:out, inputText:'«' + trimmed + '» (осн. ' + src + ')',
      operation:'Системы счисления — ' + src + ' → ' + dst };
  }

  /* =====================================================================
   *  Единая точка входа
   * ===================================================================== */
  function runDecode() {
    var tab = state.tab;
    if (tab === 'besm6')     return decodeBesm6(state.values.besm6);
    if (tab === 'ieee')      return decodeIeee(state.values.ieee, state.widths.ieee);
    if (tab === 'integer')   return decodeInteger(state.values.integer, state.widths.integer, state.signed);
    if (tab === 'command')   return decodeCommand(state.values.command, state.syntax);
    if (tab === 'registers') return decodeRegisters();
    if (tab === 'punchcard') return decodePunchcardReport();
    if (tab === 'radix') {
      return convertRadix($('#radixInput').value,
        parseInt($('#radixFrom').value, 10), parseInt($('#radixTo').value, 10));
    }
    throw new Error('Неизвестная вкладка: ' + tab);
  }

  /* =====================================================================
   *  Рендер битов (общий)
   * ===================================================================== */
  var bitGrid = $('#bitGrid');
  var legendBox = $('#legend');
  var bitsInfo = $('#bitsInfo');
  var bitsNote = $('#bitsNote');

  function cellSize(w) {
    if (w <= 24) return 34;
    if (w <= 32) return 27;
    if (w <= 48) return 21;
    return 17;
  }
  function renderBits() {
    var tab = state.tab;
    if (tab === 'radix' || tab === 'registers' || tab === 'punchcard') return;
    var width = state.widths[tab];
    var value = state.values[tab];
    var fields = getFields(tab, width, value);
    var size = cellSize(width);
    bitGrid.style.gridTemplateColumns = 'repeat(' + width + ', ' + size + 'px)';
    bitGrid.innerHTML = '';
    fields.forEach(function (f) {
      var label = document.createElement('div');
      label.className = 'field-label k-' + f.kind;
      label.style.gridRow = '1';
      label.style.gridColumn = (width - f.msb) + ' / span ' + (f.msb - f.lsb + 1);
      label.textContent = f.name;
      label.dataset.field = f.name;
      var dMsb = displayIndex(tab, f.msb);
      var dLsb = displayIndex(tab, f.lsb);
      label.title = f.name + ' · биты ' + dMsb + '…' + dLsb;
      label.addEventListener('mouseenter', function () { highlightField(f.name); });
      label.addEventListener('mouseleave', function () { highlightField(null); });
      bitGrid.appendChild(label);
    });
    for (var i = width - 1; i >= 0; i--) {
      var bit = getBit(value, i);
      var field = findField(fields, i);
      var shownIdx = displayIndex(tab, i);
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'bit-cell' + (bit === 1 ? ' on' : '') +
        (field ? ' k-' + field.kind : ' k-value');
      btn.style.gridRow = '2';
      btn.style.gridColumn = String(width - i);
      btn.dataset.index = String(i);
      if (field) btn.dataset.field = field.name;
      btn.title = (field ? field.name + ' · ' : '') + 'бит ' + shownIdx + ' = ' + bit;
      var vv = document.createElement('span');
      vv.className = 'v'; vv.textContent = String(bit);
      var ii = document.createElement('span');
      ii.className = 'i'; ii.textContent = String(shownIdx);
      btn.appendChild(vv); btn.appendChild(ii);
      bitGrid.appendChild(btn);
    }
    bitsInfo.textContent = width + ' бит · старший → младший · клик переключает';
    bitsNote.textContent = bitNumberingNote(tab);
    renderLegend(fields);
  }
  function renderLegend(fields) {
    legendBox.innerHTML = '';
    var seen = {};
    fields.forEach(function (f) {
      if (seen[f.kind]) return;
      seen[f.kind] = true;
      var item = document.createElement('span');
      item.className = 'legend-item';
      var sw = document.createElement('span');
      sw.className = 'legend-swatch';
      sw.style.background = 'var(--k-' + f.kind + '-bg)';
      sw.style.borderColor = 'var(--k-' + f.kind + '-fg)';
      var lb = document.createElement('span');
      lb.textContent = KIND_LABELS[f.kind] || f.kind;
      item.appendChild(sw); item.appendChild(lb);
      legendBox.appendChild(item);
    });
  }
  function highlightField(name) {
    var nodes = bitGrid.querySelectorAll('.bit-cell, .field-label');
    for (var i = 0; i < nodes.length; i++) {
      if (name && nodes[i].dataset.field === name) nodes[i].classList.add('hl');
      else nodes[i].classList.remove('hl');
    }
  }
  bitGrid.addEventListener('mouseover', function (e) {
    var el = e.target.closest('.bit-cell');
    if (el) highlightField(el.dataset.field || null);
  });
  bitGrid.addEventListener('mouseleave', function () { highlightField(null); });
  bitGrid.addEventListener('click', function (e) {
    var btn = e.target.closest('.bit-cell');
    if (!btn) return;
    try {
      var idx = Number(btn.dataset.index);
      var tab = state.tab;
      state.values[tab] ^= (1n << BigInt(idx));
      state.values[tab] &= maskOf(state.widths[tab]);
      logDebug('bit toggled', { tab:tab, index:idx, value:state.values[tab].toString() });
      renderBits();
      liveDecode();
    } catch (err) { logError('Переключение бита', err); }
  });

  /* =====================================================================
   *  Результат
   * ===================================================================== */
  var resultCard = $('#resultCard');
  function line(key, value, big) {
    return '<div class="result-line' + (big ? ' big' : '') + '">' +
             '<span class="k">' + escapeHtml(key) + '</span>' +
             '<span class="v">' + escapeHtml(value) + '</span>' +
           '</div>';
  }
  function renderResult(result) {
    if (result.kind === 'registers') { renderRegistersPanel(); return; }
    if (result.kind === 'punchcard') return;
    var html = '';
    if (result.kind === 'besm6') {
      html += line('Значение', result.resultText, true);
      html += line('Смещённый порядок P', String(result.rawExponent));
      html += line('Истинный порядок', String(result.exponent));
      html += line('Мантисса (41 бит)', result.mantissa.toString());
    } else if (result.kind === 'ieee') {
      html += line('Значение', result.resultText, true);
      html += line('Класс', result.classText);
      html += line('Сырой порядок E', String(result.rawExponent));
      html += line('Дробная часть F', result.fraction.toString());
    } else if (result.kind === 'integer') {
      html += line('Значение', result.resultText, true);
      html += line('Режим', state.signed ? 'Знаковый (доп. код)' : 'Беззнаковый');
    } else if (result.kind === 'command') {
      html += '<div class="result-line big"><span class="k">Инструкция (' +
        SYNTAX_LABEL[result.syntax] + ')</span>' +
        '<span class="v">' + escapeHtml(result.displayText) + '</span></div>';
      html += line('Индекс-регистр', 'M' + result.register);
      html += line('Формат', result.isLong ? 'Длинная (Format 2, 15-бит адрес)'
                                            : 'Короткая (Format 1, 12-бит адрес)');
      html += line('Код операции', toOctal(result.opcode, result.isLong ? 3 : 2) + '₈' +
        (result.isExtracode ? ' (экстракод)' : ' · ' + (result.mnemonic || '—')));
      html += line('Адрес', toOctal(result.address, 5) + '₈ = ' + result.address + '₁₀');
      html += line('Описание', result.description);
    } else if (result.kind === 'radix') {
      html += line('Результат', result.resultText, true);
      html += line('Основание', $('#radixFrom').value + ' → ' + $('#radixTo').value);
    }
    if (result.formula) {
      html += '<div class="formula-block">' +
                '<div class="formula-label">Формула преобразования</div>' +
                '<div class="formula">' + result.formula + '</div>' +
              '</div>';
    }
    resultCard.innerHTML = html;
  }
  function renderResultError(msg) {
    resultCard.innerHTML = '<div class="result-error">' + escapeHtml(msg) + '</div>';
  }

  /* Регистры: клики по битам */
  resultCard.addEventListener('click', function (e) {
    var btn = e.target.closest('.reg-bit');
    if (!btn || btn.disabled) return;
    try {
      var regName = btn.dataset.reg;
      var bitIdx = Number(btn.dataset.bit);
      var width = regWidth(regName);
      var val = getRegValue(regName);
      val ^= (1n << BigInt(bitIdx));
      setRegValue(regName, val, width);
      var isOn = getBit(val, bitIdx) === 1;
      btn.classList.toggle('on', isOn);
      btn.textContent = isOn ? '1' : '0';
      var lineEl = btn.closest('.reg-line');
      if (lineEl) {
        var valueEl = lineEl.querySelector('.reg-value');
        if (valueEl) valueEl.innerHTML = renderRegValue(regName, val, width);
      }
      if (regName === 'R') {
        var rDecodeEl = document.getElementById('R-decode');
        if (rDecodeEl) rDecodeEl.innerHTML = renderRDecoding(val);
      }
      logDebug('reg bit', { reg:regName, bit:bitIdx });
    } catch (err) { logError('Переключение бита регистра', err); }
  });

  /* =====================================================================
   *  Журнал
   * ===================================================================== */
  var journalBox = $('#journal');
  function appendReport(report) {
    state.reports.push(report);
    var entry = document.createElement('article');
    entry.className = 'journal-entry' + (report.isError ? ' error' : '');
    var time = new Date().toLocaleTimeString('ru-RU');
    var stepsHtml = report.steps.map(function (s) { return '<li>' + escapeHtml(s) + '</li>'; }).join('');
    entry.innerHTML =
      '<header><span class="j-time">' + escapeHtml(time) + '</span>' +
      '<span class="j-op">' + escapeHtml(report.operation) + '</span></header>' +
      '<div class="j-input">Вход: <code>' + escapeHtml(report.inputText) + '</code></div>' +
      '<ol class="j-steps">' + stepsHtml + '</ol>' +
      '<div class="j-result">Результат: <strong>' + escapeHtml(report.resultText) + '</strong></div>';
    journalBox.appendChild(entry);
    journalBox.scrollTop = journalBox.scrollHeight;
    console.info('[BitVisualizer] ' + report.operation + ' → ' + report.resultText);
  }
  function appendErrorReport(where, error) {
    var msg = error && error.message ? error.message : String(error);
    appendReport({ operation:'Ошибка — ' + where, inputText:'—', resultText:msg,
      steps:['Проверьте введённые данные.','Подробности записаны в консоль браузера.'],
      isError:true });
  }

  /* =====================================================================
   *  Live decode
   * ===================================================================== */
  function liveDecode() {
    try { var r = runDecode(); renderResult(r); return r; }
    catch (err) { logError('Живое декодирование', err);
      renderResultError(err.message || String(err)); return null; }
  }
  function commitDecode() {
    try { var r = runDecode(); renderResult(r); appendReport(r); }
    catch (err) {
      logError('Декодирование', err, { tab: state.tab });
      renderResultError(err.message || String(err));
      appendErrorReport('вкладка «' + state.tab + '»', err);
    }
  }

  /* =====================================================================
   *  Вкладки
   * ===================================================================== */
  var tabsBar = $('#tabs');
  var bitsPanel = $('#bitsPanel');
  var actionsRow = $('#actionsRow');
  var decodeBtn = $('#decodeBtn');
  var decodeHint = $('#decodeHint');

  function setTab(tab) {
    state.tab = tab;
    var btns = tabsBar.querySelectorAll('.tab');
    for (var i = 0; i < btns.length; i++)
      btns[i].classList.toggle('active', btns[i].dataset.tab === tab);
    var groups = document.querySelectorAll('.control-group[data-tab]');
    for (var j = 0; j < groups.length; j++)
      groups[j].classList.toggle('hidden', groups[j].dataset.tab !== tab);
    bitsPanel.classList.toggle('hidden',
      tab === 'radix' || tab === 'registers' || tab === 'punchcard');

    if (tab === 'radix') {
      resultCard.innerHTML = '<div class="result-empty">Введите число и основания.</div>';
      decodeBtn.textContent = 'Декодировать';
      decodeHint.textContent = 'Результат обновляется автоматически.';
    } else if (tab === 'registers') {
      renderRegistersPanel();
      decodeBtn.textContent = 'В журнал';
      decodeHint.textContent = 'Клик по биту переключает его; значение обновляется сразу.';
    } else if (tab === 'punchcard') {
      renderPunchcardView();
      decodeBtn.textContent = 'В журнал';
      decodeHint.textContent = 'Клик по клетке пробивает отверстие. Текст ↔ отверстия синхронизируются.';
    } else {
      renderBits();
      liveDecode();
      decodeBtn.textContent = 'Декодировать';
      decodeHint.textContent = 'Результат обновляется автоматически при переключении битов.';
    }
    logDebug('tab switched', tab);
  }
  tabsBar.addEventListener('click', function (e) {
    var b = e.target.closest('.tab'); if (!b) return;
    setTab(b.dataset.tab);
  });

  /* =====================================================================
   *  Обработчики
   * ===================================================================== */
  $('#clearBits').addEventListener('click', function () {
    if (state.tab === 'radix' || state.tab === 'registers' || state.tab === 'punchcard') return;
    state.values[state.tab] = 0n; renderBits(); liveDecode();
  });
  $('#invertBits').addEventListener('click', function () {
    if (state.tab === 'radix' || state.tab === 'registers' || state.tab === 'punchcard') return;
    var w = state.widths[state.tab];
    state.values[state.tab] = (~state.values[state.tab]) & maskOf(w);
    renderBits(); liveDecode();
  });
  decodeBtn.addEventListener('click', commitDecode);

  $('#ieeeFormat').addEventListener('change', function (e) {
    state.widths.ieee = parseInt(e.target.value, 10);
    state.values.ieee = 0n; renderBits(); liveDecode();
  });
  $('#intWidth').addEventListener('change', function (e) {
    state.widths.integer = parseInt(e.target.value, 10);
    state.values.integer = 0n; renderBits(); liveDecode();
  });
  var signRadios = document.querySelectorAll('input[name="intSign"]');
  for (var sr = 0; sr < signRadios.length; sr++) {
    signRadios[sr].addEventListener('change', function (e) {
      state.signed = e.target.value === 'signed'; renderBits(); liveDecode();
    });
  }
  $('#cmdSyntax').addEventListener('change', function (e) {
    state.syntax = e.target.value;
    logDebug('syntax switched', state.syntax);
    if (state.tab === 'command') liveDecode();
  });
  var regFormatRadios = document.querySelectorAll('input[name="regFormat"]');
  for (var rf = 0; rf < regFormatRadios.length; rf++) {
    regFormatRadios[rf].addEventListener('change', function (e) {
      state.regFormat = parseInt(e.target.value, 10);
      logDebug('register format switched', state.regFormat);
      if (state.tab === 'registers') renderRegistersPanel();
    });
  }
  $('#clearRegs').addEventListener('click', function () {
    state.registers.A = 0n; state.registers.Y = 0n; state.registers.R = 0n;
    state.registers.C = 0n; state.registers.K = 0n;
    for (var i = 0; i < 16; i++) state.registers.M[i] = 0n;
    if (state.tab === 'registers') renderRegistersPanel();
    logDebug('registers cleared');
  });

  $('#pcText').addEventListener('input', function () {
    if (state.tab === 'punchcard') generatePunchFromText();
  });
  $('#pcFormat').addEventListener('change', function () {
    if (state.tab === 'punchcard') generatePunchFromText();
  });
  $('#pcZoom').addEventListener('change', function () {
    if (state.tab === 'punchcard') updatePunchZoom();
  });
  $('#pcClear').addEventListener('click', function () {
    if (state.tab !== 'punchcard') return;
    punchHoles = [];
    for (var i = 0; i < PC_ROWS; i++) punchHoles.push(new Array(PC_COLS).fill(false));
    $('#pcText').value = '';
    renderPunchHoles();
  });
  $('#pcExportPng').addEventListener('click', function () {
    if (state.tab === 'punchcard') exportPunchPNG();
  });
  $('#pcExportSvg').addEventListener('click', function () {
    if (state.tab === 'punchcard') exportPunchSVG();
  });

  $('#radixInput').addEventListener('input', function () {
    if (state.tab === 'radix') liveDecode();
  });
  $('#radixFrom').addEventListener('change', function () { if (state.tab === 'radix') liveDecode(); });
  $('#radixTo').addEventListener('change', function () { if (state.tab === 'radix') liveDecode(); });

  $('#copyJournal').addEventListener('click', function () {
    try {
      if (state.reports.length === 0) return;
      var text = state.reports.map(function (rep) {
        return rep.operation + '\nВход: ' + rep.inputText + '\n' +
          rep.steps.map(function (s, i) { return (i + 1) + '. ' + s; }).join('\n') +
          '\nРезультат: ' + rep.resultText;
      }).join('\n\n' + '-'.repeat(60) + '\n\n');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(function (err) { logError('Копирование', err); });
      } else {
        console.warn('[BitVisualizer] Clipboard API недоступен, вывод в консоль.');
        console.log(text);
      }
    } catch (err) { logError('Копирование журнала', err); }
  });
  $('#clearJournal').addEventListener('click', function () {
    state.reports = []; journalBox.innerHTML = '';
  });

  /* =====================================================================
   *  Тема
   * ===================================================================== */
  var themeToggle = $('#themeToggle');
  function applyTheme(theme) {
    state.theme = theme;
    document.documentElement.dataset.theme = theme;
    themeToggle.textContent = theme === 'dark' ? '☀ Светлая' : '🌙 Тёмная';
    try { localStorage.setItem('besm6-theme', theme); }
    catch (err) { logError('Сохранение темы', err); }
  }
  themeToggle.addEventListener('click', function () {
    applyTheme(state.theme === 'dark' ? 'light' : 'dark');
  });
  function initTheme() {
    var stored = null;
    try { stored = localStorage.getItem('besm6-theme'); } catch (e) { logError('Чтение темы', e); }
    if (stored === 'dark' || stored === 'light') { applyTheme(stored); return; }
    var pd = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(pd ? 'dark' : 'light');
  }

  /* =====================================================================
   *  Инициализация
   * ===================================================================== */
  function init() {
    initTheme();
    state.values.command = (2n << 20n) | (0x04n << 12n) | 0o100n;
    state.values.besm6 = (65n << 41n) | (1n << 39n);
    state.registers.A = (65n << 41n) | (1n << 39n);
    state.registers.R = 0x03n;
    state.registers.K = 0o1000n;
    state.registers.M[1] = 0o100n;
    state.registers.M[15] = 0o7777n;
    setTab('besm6');
    console.info('[BitVisualizer] Готово. Исправлен баг фона перфокарты.');
  }
  document.addEventListener('DOMContentLoaded', init);
  if (document.readyState !== 'loading') init();

})();
</script>
</body>
</html>
